<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}Abhay's Knowledge Base{% endif %} | My personal projects and notes</title>
  <style>
    /* ══════════════════════════════════════════════
       SHARED LAYOUT — standalone.html
       Used by: index.html, PROJECTS.md, LLM/*.md
       Hamburger sidebar works on ALL pages via this layout.
       ══════════════════════════════════════════════ */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
    }
    a { color: #fabd2f; text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 2px solid rgba(255,255,255,0.12); margin: 32px 0; }

    .page-wrapper { display: flex; max-width: 1200px; margin: 0 auto; padding: 40px 24px; gap: 40px; min-height: 100vh; }

    /* ─── Top Bar — visible only on mobile (≤800px) ─── */
    .topbar {
      display: none;                      /* hidden on desktop */
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px;
      background: #0d0d0d;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      align-items: center;
      padding: 0 16px;
      z-index: 100;
    }
    .hamburger {
      background: none; border: none; color: #fff; font-size: 24px;
      cursor: pointer; padding: 4px 8px; margin-right: 12px;
    }
    .topbar-title { font-size: 16px; font-weight: 600; color: #fff; }

    /* ─── Sidebar Overlay — dark backdrop when sidebar is open on mobile ─── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 150;
    }
    .sidebar-overlay.active { display: block; }

    /* ─── Sidebar (desktop: sticky, mobile: slides in) ─── */
    .sidebar {
      width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
      position: sticky; top: 40px; align-self: flex-start; min-height: calc(100vh - 80px);
    }
    .sidebar h1 {
      font-size: 22px; font-weight: 700; color: #fff;
      margin-bottom: 4px;
    }
    .sidebar .tagline { font-size: 14px; color: #888; margin-bottom: 24px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .sidebar nav .nav-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
    .sidebar nav a {
      display: block; padding: 8px 12px; border-radius: 6px;
      color: #ccc; font-size: 15px;
      transition: background 0.15s;
    }
    .sidebar nav a:hover { background: rgba(255,255,255,0.06); color: #fff; text-decoration: none; }

    /* Section labels (e.g. "🤖 LLM") + indented sub-items */
    .nav-section-label {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;
      color: #666; padding: 12px 12px 4px; margin-top: 4px;
    }
    .nav-indent { padding-left: 28px !important; font-size: 14px !important; }

    .main-content { flex: 1; min-width: 0; }
    .main-content h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .main-content h2 { font-size: 22px; font-weight: 600; color: #fff; margin: 32px 0 16px; }
    .main-content h3 { font-size: 18px; font-weight: 600; color: #fff; margin: 24px 0 12px; }
    .main-content p { margin-bottom: 16px; font-size: 16px; color: #ccc; }
    .main-content ul, .main-content ol { margin: 0 0 16px 20px; }
    .main-content li { margin-bottom: 6px; color: #ccc; }
    .main-content blockquote { border-left: 3px solid #fabd2f; padding-left: 16px; margin: 16px 0; color: #999; font-style: italic; }
    .main-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
    .main-content th, .main-content td { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .main-content th { color: #fff; font-weight: 600; background: rgba(255,255,255,0.04); }
    .main-content td { color: #ccc; }
    .main-content tr:hover td { background: rgba(255,255,255,0.02); }
    .main-content code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #fabd2f; }
    .main-content img { max-width: 100%; border-radius: 6px; }
    .main-content figure { margin-bottom: 24px; }
    .main-content figcaption { color: #888; font-size: 13px; margin-top: 6px; }

    /* Project cards (used on index, shared style) */
    .project-card {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 20px;
      margin: 16px 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .project-card:hover { border-color: rgba(250,189,47,0.25); background: rgba(255,255,255,0.015); }
    .project-card h3 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .project-card p { font-size: 14px; color: #999; line-height: 1.5; margin-bottom: 12px; }
    .project-card .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .project-card .links img { height: 28px; border-radius: 4px; }


.install-card {
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      margin: 8px 0;
    }
    .install-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 8px;
    }
    .install-tab {
      padding: 6px 14px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: 0.15s;
    }
    .install-tab:hover { color: #ccc; }
    .install-tab.active { color: #fabd2f; border-bottom-color: #fabd2f; }
    .install-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }
    .install-body code {
      background: transparent !important;
      color: #e0e0e0 !important;
      padding: 0 !important;
      font-size: 13px;
      word-break: break-all;
    }
    .install-body .prompt { color: #6a9955; margin-right: 8px; }
    .copy-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #888;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 12px;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .copy-btn:hover { border-color: #fabd2f; color: #fabd2f; }
    .copy-btn.copied { border-color: #34a853; color: #34a853; }

        .stats-section { text-align: center; margin: 32px 0; }
    .stats-section img { max-width: 100%; margin: 12px 0; border-radius: 6px; }

    /* ─── Responsive: Mobile / Portrait (≤800px) ───
         - Top bar with hamburger appears
         - Sidebar slides in from left (hidden by default)
         - Dark overlay behind sidebar
         - Tap overlay or hamburger to close
         ─────────────────────────────────────────── */
    @media (max-width: 800px) {
      .topbar { display: flex; }
      .page-wrapper { padding-top: 72px; flex-direction: column; padding: 72px 16px 24px; gap: 24px; }

      .sidebar {
        position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
        z-index: 200; background: #0d0d0d; border-right: 1px solid rgba(255,255,255,0.08);
        padding: 24px 20px; overflow-y: auto;
        transition: left 0.25s ease;
        align-self: auto; sticky: unset;
      }
      .sidebar.open { left: 0; }
      .sidebar h1 { font-size: 20px; }

      .main-content h1 { font-size: 26px; }
      .main-content table { font-size: 12px; }
      .main-content th, .main-content td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <!-- Mobile top bar — visible on all pages in portrait mode -->
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
    <span class="topbar-title">Abhay's Knowledge Base</span>
  </div>

  <!-- Dark overlay behind sidebar (mobile only) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="page-wrapper">
    <aside class="sidebar" id="sidebar">
      <h1>Abhay's Knowledge Base</h1>
      <p class="tagline">My personal projects and notes</p>
      <nav>
        <a href="/abhay-kb/">Home</a>
        <a href="/abhay-kb/PROJECTS">All Projects</a>
        <a href="/abhay-kb/LLM/jobs">Job Listings</a>
        <!-- LLM dropdown section -->
        <div class="nav-section-label">LLM</div>
        <a href="/abhay-kb/LLM/" class="nav-indent">Overview</a>
        <a href="/abhay-kb/LLM/models" class="nav-indent">Models</a>
        <a href="/abhay-kb/LLM/coding-plans" class="nav-indent">Coding Plans</a>
        <div class="nav-section-label">AI Tools</div>
        <a href="/abhay-kb/AI-Tools/" class="nav-indent">Overview</a>
        <a href="/abhay-kb/AI-Tools/tools" class="nav-indent">Tools</a>
        <a href="/abhay-kb/AI-Tools/mcp" class="nav-indent">MCP</a>
        <a href="/abhay-kb/AI-Tools/ide" class="nav-indent">IDE</a>
        <a href="/abhay-kb/AI-Tools/skills" class="nav-indent">Skills</a>
        <a href="/abhay-kb/about-me" class="nav-bottom">About Me</a>
      </nav>
    </aside>
    <main class="main-content">
      {{ content }}
    </main>
  </div>

  <!-- Hamburger toggle — works on every page because this layout is shared -->
  <script>
    function copyCmd(el, cmd) {
      navigator.clipboard.writeText(cmd).then(() => {
        el.textContent = 'Copied!';
        el.classList.add('copied');
        setTimeout(() => { el.textContent = 'Copy'; el.classList.remove('copied'); }, 1500);
      });
    }
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }
  </script>
</body>
</html>
